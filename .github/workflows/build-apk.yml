name: Build Bunde Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Native Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename and Verify bunde.apk exists
        run: |
          ORIG_APK="app/build/outputs/apk/debug/app-debug.apk"
          BUNDE_APK="app/build/outputs/apk/debug/bunde.apk"
          if [ -f "$ORIG_APK" ]; then
            cp "$ORIG_APK" "$BUNDE_APK"
            echo "✅ Verified: Renamed to $BUNDE_APK successfully"
            ls -lh "$BUNDE_APK"
          else
            echo "❌ Error: APK not found at $ORIG_APK"
            find app/build -name "*.apk" || true
            exit 1
          fi

      - name: Upload Bunde APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bunde-apk
          path: app/build/outputs/apk/debug/bunde.apk
          retention-days: 14

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "Bunde Native Android v1.0.4"
          body: "Direct `bunde.apk` download for Bunde (Native Android Jetpack Compose App with In-App Update Checker)."
          files: app/build/outputs/apk/debug/bunde.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
